<!doctype html>
<html lang="es" data-palette="#2563eb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auditoría 25 — Likida</title>
<style>
  /* Paleta de ESTADO (reservada, nunca reusada como "serie 4"): el color
     codifica LA NOTA, jamás el delta. Un rubro que sube de 4 a 5 sigue en
     ámbar; pintarlo verde por haber subido es la mentira que esta rutina
     existe para evitar. */
  :root{
    --fondo:#f6f7f9; --sup:#fff; --borde:#e3e6ea;
    --tinta:#12161c; --tinta2:#454d59; --tinta3:#6b7480;
    --malo:#b42318; --malo-bg:#fef3f2;
    --medio:#b54708; --medio-bg:#fffaeb;
    --bien:#067647; --bien-bg:#ecfdf3;
    --linea:#2563eb;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --fondo:#0d1117; --sup:#161b22; --borde:#2a313a;
      --tinta:#e8edf3; --tinta2:#aeb8c4; --tinta3:#7d8896;
      --malo:#ff8a7a; --malo-bg:#2a1512;
      --medio:#f5b544; --medio-bg:#2a1f0d;
      --bien:#5fd39b; --bien-bg:#0e2a1c;
      --linea:#7aa7ff;
    }
  }
  :root[data-theme="dark"]{
    --fondo:#0d1117; --sup:#161b22; --borde:#2a313a;
    --tinta:#e8edf3; --tinta2:#aeb8c4; --tinta3:#7d8896;
    --malo:#ff8a7a; --malo-bg:#2a1512;
    --medio:#f5b544; --medio-bg:#2a1f0d;
    --bien:#5fd39b; --bien-bg:#0e2a1c;
    --linea:#7aa7ff;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--fondo); color:var(--tinta);
    font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; padding:28px 22px 40px; overflow-x:hidden}
  .envoltura{max-width:1180px; margin:0 auto}
  h1{font-size:21px; margin:0 0 2px; letter-spacing:-.2px}
  .sub{color:var(--tinta3); font-size:13px; margin-bottom:18px}
  .panel{background:var(--sup); border:1px solid var(--borde); border-radius:12px}

  .compuerta{display:flex; flex-wrap:wrap; gap:1px; overflow:hidden; margin-bottom:14px}
  .compuerta .c{flex:1 1 150px; padding:11px 14px; background:var(--sup)}
  .compuerta .k{font-size:11px; color:var(--tinta3); text-transform:uppercase; letter-spacing:.5px}
  .compuerta .v{font-size:15px; font-weight:650; margin-top:3px}
  .ok{color:var(--bien)} .mal{color:var(--malo)} .adv{color:var(--medio)}
  .compuerta .n{font-size:12px; color:var(--tinta2); font-weight:400; margin-top:1px}

  .fila{display:grid; grid-template-columns:1fr 340px; gap:14px; margin-bottom:14px}
  @media (max-width:900px){ .fila{grid-template-columns:1fr} }

  .rompio{padding:15px 17px; background:var(--malo-bg); border-color:var(--malo)}
  .rompio .t{font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--malo); font-weight:700; margin-bottom:8px}
  .rompio ul{margin:0; padding-left:17px} .rompio li{margin:5px 0; color:var(--tinta)}

  .global{padding:15px 17px; text-align:center}
  .global .t{font-size:12px; color:var(--tinta3); text-transform:uppercase; letter-spacing:.5px}
  .global .n{font-size:46px; font-weight:700; line-height:1.05; margin:4px 0 2px; letter-spacing:-1px}
  .global .d{font-size:13px; color:var(--tinta2)}

  .rejilla{display:grid; grid-template-columns:repeat(auto-fill,minmax(272px,1fr)); gap:10px; margin-bottom:14px}
  .rubro{padding:12px 14px; display:flex; gap:12px; align-items:flex-start}
  .nota{min-width:46px; height:46px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    font-size:21px; font-weight:700; border:1px solid}
  .n-malo{background:var(--malo-bg); color:var(--malo); border-color:var(--malo)}
  .n-medio{background:var(--medio-bg); color:var(--medio); border-color:var(--medio)}
  .n-bien{background:var(--bien-bg); color:var(--bien); border-color:var(--bien)}
  .rubro .cuerpo{min-width:0}
  .rubro .nom{font-weight:640; font-size:13.5px; display:flex; align-items:center; gap:7px; flex-wrap:wrap}
  .delta{font-size:11.5px; font-weight:650; padding:1px 6px; border-radius:20px; border:1px solid var(--borde); color:var(--tinta2)}
  .rubro .riesgo{font-size:12.2px; color:var(--tinta2); margin-top:3px}
  .sinauditar{font-size:11px; color:var(--tinta3); font-style:italic}

  .serie{padding:15px 17px}
  .serie .t{font-size:12px; color:var(--tinta3); text-transform:uppercase; letter-spacing:.5px; margin-bottom:10px}

  .hall{padding:15px 17px; margin-bottom:14px}
  .hall .t{font-size:12px; color:var(--tinta3); text-transform:uppercase; letter-spacing:.5px; margin-bottom:4px}
  .tabla-env{overflow-x:auto; margin-top:8px}
  table{border-collapse:collapse; width:100%; min-width:660px; font-size:12.8px}
  th{text-align:left; font-weight:640; color:var(--tinta3); font-size:11px; text-transform:uppercase;
     letter-spacing:.4px; padding:6px 9px 6px 0; border-bottom:1px solid var(--borde); white-space:nowrap}
  td{padding:8px 9px 8px 0; border-bottom:1px solid var(--borde); vertical-align:top; color:var(--tinta2)}
  td.q{color:var(--tinta)}
  .sev{font-weight:700; font-size:11px; letter-spacing:.3px; white-space:nowrap}
  .s-crit{color:var(--malo)} .s-alto{color:var(--medio)}
  .est{font-size:11px; font-weight:650; padding:2px 7px; border-radius:20px; white-space:nowrap; border:1px solid}
  .e-arr{background:var(--bien-bg); color:var(--bien); border-color:var(--bien)}
  .e-pen{background:var(--medio-bg); color:var(--medio); border-color:var(--medio)}
  .e-pro{background:var(--sup); color:var(--tinta2); border-color:var(--borde)}
  .rein{font-size:10.5px; font-weight:700; color:var(--malo); border:1px solid var(--malo);
    border-radius:20px; padding:1px 6px; margin-left:5px; white-space:nowrap}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.8px;
    background:var(--fondo); padding:1px 4px; border-radius:4px; border:1px solid var(--borde)}
  .pie{color:var(--tinta3); font-size:12px; margin-top:16px; line-height:1.6}
</style>
</head>
<body>
<div class="envoltura">
  <h1>Auditoría 25 — Likida</h1>
  <div class="sub" id="sub"></div>

  <div class="panel compuerta" id="compuerta"></div>

  <div class="fila">
    <div class="panel rompio" id="rompio"></div>
    <div class="panel global" id="global"></div>
  </div>

  <div class="rejilla" id="rejilla"></div>

  <div class="fila">
    <div class="panel serie" id="serie"></div>
    <div class="panel serie" id="reincidentes"></div>
  </div>

  <div class="panel hall" id="hall"></div>

  <div class="pie" id="pie"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// UNA SOLA FUENTE DE DATOS. La síntesis se corrige a mano y el tablero se
// desincroniza: aquí los números viven en un solo sitio y se pintan de él.
// ═══════════════════════════════════════════════════════════════════════════
const D = {
  fecha: '3 de septiembre de 2026',
  tipo: 'Ronda COMPLETA · 12 rubros · rama <code>claude/auditoria-25</code> · base <code>master</code> = 4f94490',
  global: null,        // se calcula
  globalAnterior: 6.2,
  serie: [
    { r: 22, f: '30 ago', g: 6.1 },
    { r: 23, f: '31 ago', g: 5.4 },
    { r: 24, f: '2 sep',  g: 6.2 },
  ],
  compuerta: [
    { k: 'npm test', v: '10,962 verdes', n: '820 archivos · 1 saltada · +12 de esta ronda', ok: true },
    { k: 'tsc --noEmit', v: '0 errores', n: 'exit 0', ok: true },
    { k: 'eslint', v: '0 errores', n: '173 avisos · trinquete 173/173, 0 nuevos', ok: true },
    { k: 'npm run build', v: 'no corre aquí', n: 'pide Supabase/OpenRouter — a propósito', ok: null },
    { k: 'Producción', v: '9 commits atrás', n: 'el [deploy] se lo comió un merge commit', ok: false },
  ],
  rubros: [
    { n:'Frontend',        h:5, a:6, r:'El chip del Cotizador sigue en 1.24:1 con el SO en oscuro. Tercera ronda sin cerrar ninguno de sus 13 abiertos.' },
    { n:'Backend y API',   h:6, a:7, r:'El ajuste del contralor mueve el total y no el desglose: la póliza carga un IVA no acreditable inventado, o el export del mes entero se cae con 409.' },
    { n:'Sistema agéntico',h:5, a:5, r:'El arreglo de la 24 cerró la ENTRADA de WhatsApp y dejó las tres SALIDAS abiertas. Cerradas y reauditadas esta ronda — pero quedan dos más, por correo.' },
    { n:'Tool calling',    h:6, a:7, r:'TC-1 quedó cerrado a medias: el predicado de copias es el mismo, el ORDEN no — y de él depende cuál copia se cuenta.' },
    { n:'Seguridad',       h:6, a:7, r:'La baja cerraba panel, RLS y Auth, y dejaba vivo el token MCP que lee el dinero por service_role. Cerrado esta ronda.' },
    { n:'Cumplimiento fiscal', h:4, a:5, r:'Cuatro puertas distintas imprimen una cifra fiscal que no coincide con el motor. El ancla del rubro dice 3 o menos si imprime una; imprime cuatro.' },
    { n:'Cumplimiento legal',  h:5, a:7, r:'El aviso de prospectos no nombra al modelo entre sus encargadas, y «contesta BAJA y se borran tus datos» no borra nada.' },
    { n:'Arquitectura',    h:4, a:6, r:'La proporción de LIVA 5 fr. I vive en tres archivos y el tercero solo conoce la mitad de las reglas. El patrón «dos lugares que calculan lo mismo» creció de 4 sitios a 9.' },
    { n:'Pruebas',         h:7, a:7, r:'12 mutaciones, 6 muertas: cero sobrevivientes en el motor y la escritura del dinero. Las 6 vivas están en las compuertas y en la superficie nueva.' },
    { n:'Operabilidad y DX', h:5, a:5, r:'Un PR abierto solo para publicar no publicó nada: el [deploy] viajaba en el cuerpo del merge y la compuerta lee el asunto. Las tres alarmas dijeron que todo iba bien.' },
    { n:'Rendimiento y costo', h:5, a:6, r:'El costo por liquidación declarado en $0.05 contra los ~$0.144 de entrada sola que mide el propio repo — y de ese número sale el techo diario de IA de cada flota.' },
    { n:'Modelo de datos', h:5, a:6, r:'Un CHECK rechazaba una fase que el código escribe a diario y tiraba el costo de cada nota de voz. Cerrado esta ronda.' },
  ],
  rompio: [
    '<b>Diez rubros bajan, dos se quedan, ninguno sube.</b> No porque el código empeorara —siete de los doce no recibieron un solo commit desde la 24— sino porque la 24 midió 188 commits de golpe y <b>calificó de más</b>. Nueve de los doce firman «mirada más profunda» con esas palabras.',
    'El arreglo estrella de la 24 estaba <b>cerrado a la mitad</b>: tapó la entrada de WhatsApp y dejó las tres salidas abiertas. Al ex-empleado le seguían llegando el PDF del contralor y el 🚨 con el GPS del chofer. <b>Arreglado</b>.',
    'La <b>reauditoría del propio arreglo</b> encontró que se hizo sobre las <b>líneas</b> que el hallazgo enumeraba y no sobre la <b>pregunta</b> que hacía: quedan dos salidas más, por correo. Es el mismo reproche que esta ronda le hizo a la 24.',
    '<b>El humano SÍ puso la bandera de despliegue y el sistema se la comió.</b> El <code>[deploy]</code> viajaba en el cuerpo de un merge commit; la compuerta lee solo el asunto, a propósito. Producción corre <code>3cc8ead</code> con un bug del chat vivo y dos migraciones sin aplicar.',
  ],
  reincidentes: [
    'FIS-C1/C2 · los dos críticos que la 24 llamó «lo primero de la ronda 25», con los mismos números de línea (2ª y 3ª ronda)',
    'OP-C1 · producción atrás del último <code>[deploy]</code> (3ª ronda)',
    'ARQ · <code>cubetaDe</code> reconstruida en vez de llamada (4ª reconstrucción)',
    'TC-3 · abierto sin tocarse, <b>4ª ronda</b>',
    'FE-13b · el Cotizador ilegible en oscuro (2ª ronda, 13 abiertos sin cerrar)',
    'REN · la nota de voz que reserva presupuesto por byte de audio (2ª ronda)',
  ],
  hallazgos: [
    { s:'CRÍTICO', q:'La baja cierra el panel y el WhatsApp de ENTRADA, pero no las tres SALIDAS: al ex-empleado le siguen llegando las cifras del cierre, el PDF del contralor y el 🚨 con el GPS del chofer', d:'contactos.ts:141,168 · asistencia_escalamiento.ts:107', e:'arreglado', nota:'24ce4c2 — 6 pruebas, rojo→verde comprobado revirtiendo cada archivo por separado', rein:true },
    { s:'ALTO', q:'Y hay una CUARTA y una QUINTA salida, por CORREO: el cron de facturación le sigue mandando los CFDI de la flota al ex-contador', d:'flota_fiscal.ts:106 · notificaciones.ts:705', e:'propuesto', nota:'NUEVO, de la REAUDITORÍA del propio arreglo. El barrido buscó `telefono`; estas resuelven por `email`. Tope de 3 vueltas AGOTADO — no se tocó' },
    { s:'ALTO', q:'La baja deja vivo el token MCP, que lee el dinero de la flota por service_role y se renueva 60 días en cada uso', d:'mcp/oauth.ts:517,533', e:'arreglado', nota:'ffc95b2 — misma raíz que el crítico de arriba; 3 pruebas' },
    { s:'ALTO', q:'El CHECK rechaza la fase «transcripcion»: el costo de cada nota de voz se descarta en silencio y la cifra con la que se fija el precio sale corta', d:'0025_dominios_check.sql:146 · costos.ts:41', e:'arreglado', nota:'5660918 — migración 0304 + una prueba que cruza el tipo de TS contra el CHECK, sin base de datos' },
    { s:'CRÍTICO', q:'«Ajustar» mueve el total y no el desglose: la póliza contable carga un «IVA/IEPS no acreditable» inventado, o el export del periodo entero se cae con 409', d:'0299.sql:384 · poliza.ts:205,230', e:'pendiente', nota:'NUEVO. Verificado: grep de desglose sobre la 0299 → 0 ocurrencias. Regenerar o invalidar el papel es decisión de producto' },
    { s:'CRÍTICO', q:'«Ajustar» cambia el total y NO regenera el PDF: el papel del contralor se queda con la cifra vieja', d:'revision.ts · 0299', e:'pendiente', nota:'lo hallaron backend y datos por caminos independientes, 2ª ronda seguida', rein:true },
    { s:'CRÍTICO', q:'El panel del contador acredita el IVA COMPLETO del combustible en efectivo; el motor solo la proporción del 15%', d:'fiscal.ts:806,850 · engine.ts:493', e:'pendiente', nota:'$16,000.00 en pantalla contra $0.00 en el PDF, mismo UUID. La 24 lo llamó «lo primero de la ronda 25». Exige meterle al panel las diferencias del motor: no es quirúrgico', rein:true },
    { s:'CRÍTICO', q:'El contador del 15% del ejercicio es ciego al complemento de pago: la facilidad se concede dos veces', d:'0190.sql:36 · desde_db.ts:121', e:'pendiente', nota:'misma familia que el anterior; se arreglan juntos o se contradicen', rein:true },
    { s:'CRÍTICO', q:'El [deploy] se pierde en el merge commit: un PR abierto exclusivamente para publicar no publicó nada, y las tres alarmas dijeron que todo iba bien', d:'compuerta-deploy.mjs:89 · salud-produccion.yml:90', e:'pendiente', nota:'NUEVO. Cambiar la semántica de la compuerta de despliegue de madrugada es justo lo que esta rutina existe para no hacer' },
    { s:'CRÍTICO', q:'Producción lleva 9 commits y 2 migraciones sobre el último [deploy] efectivo', d:'último efectivo: 3cc8ead', e:'pendiente', nota:'NO ES CÓDIGO, y el Redeploy del panel ya NO basta: redespliega 3cc8ead. Hay que aplicar 0302/0303 y publicar el tip', rein:true },
  ],
  descartados: [
    { q:'«El seam de la firma humana (0299) no tiene una sola prueba» (backend, 24)', r:'REFUTADO por el auditor de pruebas: sí las tiene — 14 casos en TS más los bloques SQL 246/247 de la batería.' },
    { q:'«La flota da de baja a su único flota_admin» (escenario de AGEN-C1)', r:'CORREGIDO, no descartado: `usuarios_escritura.ts:186` impide dar de baja al único dueño activo. El hallazgo aguanta por el CONTADOR, que no tiene esa guarda, y por el `.find()` con dos dueños. El arreglo no cambia.' },
    { q:'«El runner despacha agentes graduados con prompt_ref NULL» (hipótesis del orquestador)', r:'FALSO. El runner nunca lee `prompt_ref`: los nueve graduados pasan los cinco candados y aterrizan en su rama de despacho. Lo que sí se rompió es el parte semanal del agente de documentación.' },
    { q:'«La 0302 dejó callers resolviendo a la firma retirada»', r:'FALSO. Verificado por rendimiento y por datos: el único call-site pasa los 8 argumentos nombrados y el redondeo de la reserva no cambia.' },
    { q:'Dos archivos de prueba en rojo a media ronda', r:'INFRA, no regresión. Eran las mutaciones vivas del auditor de pruebas durante mi corrida de la suite. Al terminar él y restaurar, la misma suite dio 820/820. No se revirtió nada.' },
  ],
};

const clase = (n) => n <= 4 ? 'malo' : n <= 6 ? 'medio' : 'bien';
const flecha = (h, a) => h === null ? '<span class="sinauditar">no auditado esta ronda</span>'
  : h > a ? `<span class="delta" style="color:var(--bien)">▲ ${h-a}</span>`
  : h < a ? `<span class="delta" style="color:var(--malo)">▼ ${a-h}</span>`
  : '<span class="delta">= sin cambio</span>';

// La global es la media de los 12; un rubro sin auditar conserva su nota.
const notas = D.rubros.map(r => r.h === null ? r.a : r.h);
D.global = Math.round(notas.reduce((a,b)=>a+b,0) / notas.length * 10) / 10;

document.getElementById('sub').innerHTML = D.fecha + ' · ' + D.tipo;

document.getElementById('compuerta').innerHTML = D.compuerta.map(c => `
  <div class="c"><div class="k">${c.k}</div>
    <div class="v ${c.ok === true ? 'ok' : c.ok === false ? 'mal' : 'adv'}">${c.v}</div>
    <div class="n">${c.n}</div></div>`).join('');

document.getElementById('rompio').innerHTML =
  '<div class="t">Qué se rompió que ayer estaba bien</div><ul>' +
  D.rompio.map(x => `<li>${x}</li>`).join('') + '</ul>';

const dg = D.global - D.globalAnterior;
document.getElementById('global').innerHTML = `
  <div class="t">Global</div>
  <div class="n" style="color:var(--${clase(D.global)})">${D.global.toFixed(1)}</div>
  <div class="d">${dg > 0 ? '▲' : dg < 0 ? '▼' : '='} ${Math.abs(dg).toFixed(1)} contra la ronda 24 (${D.globalAnterior.toFixed(1)})</div>
  <div class="d" style="margin-top:6px; font-size:12px; color:var(--tinta3)">media de los 12 rubros</div>`;

document.getElementById('rejilla').innerHTML = D.rubros.map(r => {
  const n = r.h === null ? r.a : r.h;
  return `<div class="panel rubro">
    <div class="nota n-${clase(n)}">${n}</div>
    <div class="cuerpo">
      <div class="nom">${r.n} ${flecha(r.h, r.a)}</div>
      <div class="riesgo">${r.r || '—'}</div>
    </div></div>`;
}).join('');

// Serie histórica: una sola serie, sin leyenda — el título la nombra.
(() => {
  const pts = [...D.serie, { r: 25, f: '3 sep', g: D.global }];
  const W = 300, H = 110, PX = 34, PY = 16;
  const min = 4.5, max = 7;
  const x = i => PX + i * ((W - PX - 14) / (pts.length - 1));
  const y = g => PY + (max - g) / (max - min) * (H - PY - 26);
  const linea = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.g).toFixed(1)}`).join(' ');
  document.getElementById('serie').innerHTML = `
    <div class="t">Serie histórica de la global</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img"
         aria-label="Global: ${pts.map(p => `${p.g.toFixed(1)} el ${p.f}`).join(', ')}.">
      ${[5, 6, 7].map(g => `<line x1="${PX}" y1="${y(g)}" x2="${W - 14}" y2="${y(g)}"
          stroke="var(--borde)" stroke-width="1"/>
        <text x="${PX - 7}" y="${y(g) + 4}" font-size="10" text-anchor="end" fill="var(--tinta3)">${g}</text>`).join('')}
      <path d="${linea}" fill="none" stroke="var(--linea)" stroke-width="2"
            stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.map((p, i) => `
        <circle cx="${x(i)}" cy="${y(p.g)}" r="4.5" fill="var(--linea)"
                stroke="var(--sup)" stroke-width="2"/>
        <text x="${x(i)}" y="${y(p.g) - 11}" font-size="11" font-weight="650"
              text-anchor="middle" fill="var(--tinta)">${p.g.toFixed(1)}</text>
        <text x="${x(i)}" y="${H - 6}" font-size="10" text-anchor="middle"
              fill="var(--tinta3)">${p.f}</text>`).join('')}
    </svg>`;
})();

document.getElementById('reincidentes').innerHTML =
  '<div class="t">Reincidentes — peor noticia que uno nuevo</div><ul style="margin:0; padding-left:17px">' +
  D.reincidentes.map(x => `<li style="margin:5px 0; color:var(--tinta2); font-size:12.5px">${x}</li>`).join('') + '</ul>';

document.getElementById('hall').innerHTML = `
  <div class="t">Los críticos, y los altos que se arreglaron con ellos</div>
  <div class="tabla-env"><table>
    <thead><tr><th>Sev</th><th>Hallazgo</th><th>Dónde</th><th>Estado</th><th>Nota</th></tr></thead>
    <tbody>${D.hallazgos.map(h => `<tr>
      <td><span class="sev s-${h.s === 'CRÍTICO' ? 'crit' : 'alto'}">${h.s}</span></td>
      <td class="q">${h.q}${h.rein ? '<span class="rein">REINCIDENTE</span>' : ''}</td>
      <td><code>${h.d}</code></td>
      <td><span class="est e-${h.e === 'arreglado' ? 'arr' : h.e === 'pendiente' ? 'pen' : 'pro'}">${h.e}</span></td>
      <td>${h.nota}</td></tr>`).join('')}</tbody>
  </table></div>
  <div class="t" style="margin-top:18px">Descartados, refutados y corregidos — la prueba de que la verificación ocurrió</div>
  <div class="tabla-env"><table>
    <thead><tr><th>Hallazgo</th><th>Qué pasó al verificarlo</th></tr></thead>
    <tbody>${D.descartados.map(d => `<tr><td class="q">${d.q}</td><td>${d.r}</td></tr>`).join('')}</tbody>
  </table></div>`;

document.getElementById('pie').innerHTML =
  `${D.hallazgos.filter(h=>h.e==='arreglado').length} hallazgos arreglados con prueba que los reproduce (1 crítico y 2 altos, en 3 commits atómicos) · ` +
  `${D.hallazgos.filter(h=>h.e==='pendiente').length} críticos pendientes con la razón escrita. ` +
  'Tope de 3 vueltas AGOTADO: los críticos que quedan no son quirúrgicos — dos son la misma regla de dinero en tres archivos, ' +
  'uno exige decidir si «ajustar» regenera o invalida el PDF, y dos son la compuerta de despliegue más una mano humana. ' +
  'Los ALTOS, MEDIOS y BAJOS restantes quedan propuestos en el archivo de cada rubro. ' +
  '<code>npm run build</code> no corre en la nube a propósito: pide credenciales que aquí no existen y su fallo no diría nada del código.';
</script>
</body>
</html>
