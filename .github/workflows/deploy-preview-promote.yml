name: Vercel preview -> smoke -> promote

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit o rama a desplegar en Preview
        required: true
        default: master
        type: string
      promote:
        description: Promover Preview validada a producción (requiere approval)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: vercel-preview-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  VERCEL_CLI_VERSION: '41.7.3'

jobs:
  preflight:
    name: Preflight de credenciales y origen
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - id: gate
        env:
          EVENT: ${{ github.event_name }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ORG: ${{ secrets.VERCEL_ORG_ID }}
          PROJECT: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ] && [ "$FORK" = "true" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Preview omitida para fork: GitHub no expone secretos a código no confiable." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ -n "$TOKEN" ] || { echo "::error::Falta VERCEL_TOKEN; no se desplegará a ciegas."; exit 1; }
          [ -n "$ORG" ] || { echo "::error::Falta VERCEL_ORG_ID."; exit 1; }
          [ -n "$PROJECT" ] || { echo "::error::Falta VERCEL_PROJECT_ID."; exit 1; }
          echo "deploy=true" >> "$GITHUB_OUTPUT"

  preview:
    name: Crear Preview inmutable
    needs: preflight
    if: needs.preflight.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Link, pull y build Preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          npx --yes "vercel@${VERCEL_CLI_VERSION}" link --yes --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=preview --token "$VERCEL_TOKEN"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" build --token "$VERCEL_TOKEN"
      - id: deploy
        name: Deploy prebuilt a Preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          url="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --token "$VERCEL_TOKEN" | tail -n1)"
          case "$url" in https://*) ;; *) echo "::error::Vercel no devolvió una URL HTTPS: $url"; exit 1 ;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Smoke público de Preview
    needs: preview
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Smoke de rutas públicas
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.preview.outputs.url }}
        run: npm run test:smoke

  promote:
    name: Promote aprobado a producción
    needs: [preview, smoke]
    if: github.event_name == 'workflow_dispatch' && inputs.promote == true
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: ${{ needs.preview.outputs.url }}
    steps:
      - name: Guardas de promoción
        env:
          URL: ${{ needs.preview.outputs.url }}
          CONFIRM: ${{ inputs.promote }}
        run: |
          set -euo pipefail
          case "$URL" in https://*) ;; *) echo "::error::URL de Preview inválida."; exit 1 ;; esac
          [ "$CONFIRM" = "true" ] || { echo "::error::Promoción no confirmada."; exit 1; }
      - name: Promover exactamente la Preview testeada
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          URL: ${{ needs.preview.outputs.url }}
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" promote "$URL" --token "$VERCEL_TOKEN"
